name: "modern_cloud_lakehouse"
version: "1.0.0"
config-version: 2

profile: "modern_cloud_lakehouse"

model-paths: ["models"]
snapshot-paths: ["snapshots"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  modern_cloud_lakehouse:
    silver:
      +schema: silver
      +materialized: incremental
    gold:
      +schema: gold
      +materialized: table

snapshots:
  modern_cloud_lakehouse:
    +target_schema: silver
